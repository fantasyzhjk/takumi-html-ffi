[workspace]
members = [
    "takumi-html",
    "bindings/takumi-render-uniffi",
    "bindings/takumi-template-uniffi",
]
default-members = [
    "takumi-html",
    "bindings/takumi-render-uniffi",
    "bindings/takumi-template-uniffi",
]
resolver = "3"

[workspace.dependencies]
takumi = { version = "2.17.1", features = ["svg-source", "rayon", "raster-backend"] }
takumi-core = "0.32.0"
thiserror = "2.0"
uniffi = "0.31.0"
serde_json = "1"
tempfile = "3.13"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
