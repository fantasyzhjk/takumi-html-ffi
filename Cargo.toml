[workspace]
members = [
    "takumi-html",
    "bindings/takumi-render-uniffi",
    "bindings/takumi-template-uniffi",
    "scripts/uniffi-bindgen",
]
default-members = [
    "takumi-html",
    "bindings/takumi-render-uniffi",
    "bindings/takumi-template-uniffi",
]
resolver = "3"

[workspace.dependencies]
takumi = { version = "2.12.0", features = ["svg-source", "rayon", "raster-backend"] }
takumi-core = "0.23.0"
thiserror = "2.0"
uniffi = "0.29.5"
serde_json = "1"
tempfile = "3.13"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
