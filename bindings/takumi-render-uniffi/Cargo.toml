[package]
name = "takumi-render-uniffi"
version = "0.2.9"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["scss"]
scss = ["grass"]
http = ["reqwest"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "rayon"] }

takumi = { workspace = true }
takumi-html = { path = "../../takumi-html" }
grass = { version = "0.13.4", optional = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
thiserror = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
takumi-template-uniffi = { path = "../takumi-template-uniffi" }
tempfile = { workspace = true }
