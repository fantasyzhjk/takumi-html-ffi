[package]
name = "takumi-template-uniffi"
version = "0.2.7"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
comrak = { version = "0.54.0", features = ["syntect"] }
minijinja = { version = "2.20", features = ["json"] }
serde_json = { workspace = true }
chrono = "0.4"
syntect = { version = "5", features = ["html"] }
thiserror = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
